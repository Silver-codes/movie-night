[project]
name = "movie-night-backend"
version = "0.1.0"
description = "Movie Night API (FastAPI + SQLModel + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
